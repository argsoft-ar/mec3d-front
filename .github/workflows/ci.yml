name: CI

# Lint + build check en feature branches y PRs.
# Los deploys a producción/staging los maneja Vercel
# automáticamente desde su integración con GitHub.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: ["**"]

jobs:
  build-and-lint:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
        env:
          # Placeholder para que el build no falle sin .env
          VITE_API_URL: https://mec3d-api.onrender.com/api/v1
