name: CI

# Lint + build check en feature branches y PRs.
# Los deploys a producción/staging los maneja Vercel
# automáticamente desde su integración con GitHub.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: ["**"]

jobs:
  build-and-lint:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.3
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
        env:
          # Placeholder para que el build no falle sin .env
          VITE_API_URL: https://mec3d-api.onrender.com/api/v1
